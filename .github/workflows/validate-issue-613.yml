name: Validate issue 613
on:
  push:
    branches: [validation/fake-sai-cpu-queues]
permissions:
  contents: read
jobs:
  fake-sai-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Make room on the disposable runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /
          free -h
      - name: Pin dependencies
        run: tar xzf fboss/oss/stable_commits/latest_stable_hashes.tar.gz --no-same-owner
      - name: Build FBOSS container
        run: |
          set -o pipefail
          mkdir -p validation-logs
          docker build -t fboss_image -f fboss/oss/docker/Dockerfile . 2>&1 | tee validation-logs/image.log
      - name: Build and test fake SAI
        run: |
          mkdir -p "$RUNNER_TEMP/fboss-613/scripts" "$RUNNER_TEMP/fboss-613/logs"
          cat > "$RUNNER_TEMP/fboss-613/scripts/build-fake-tests.sh" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          cd /var/FBOSS/fboss
          log=/var/FBOSS/tmp_bld_dir/logs/build-$(date +%Y%m%d-%H%M%S).log
          ln -sfn "$(basename "$log")" /var/FBOSS/tmp_bld_dir/logs/latest.log
          ./fboss/oss/scripts/run-getdeps.py build --allow-system-packages \
            --build-type MinSizeRel \
            --extra-cmake-defines='{"CMAKE_CXX_STANDARD": "20", "RANGE_V3_TESTS": "OFF", "RANGE_V3_PERF": "OFF"}' \
            --scratch-path /var/FBOSS/tmp_bld_dir --src-dir /var/FBOSS/fboss \
            --num-jobs 1 --cmake-target switch_test --cmake-target api_test \
            fboss 2>&1 | tee "$log"
          test_binary=$(find /var/FBOSS/tmp_bld_dir/build -type f -name switch_test -executable -print -quit)
          test -n "$test_binary"
          "$test_binary" --gtest_filter='HostifManagerTest.defaultCpu*' 2>&1 | tee /var/FBOSS/tmp_bld_dir/logs/regression.log
          "$test_binary" 2>&1 | tee /var/FBOSS/tmp_bld_dir/logs/switch-test.log
          api_binary=$(find /var/FBOSS/tmp_bld_dir/build -type f -name api_test -executable -print -quit)
          test -n "$api_binary"
          "$api_binary" 2>&1 | tee /var/FBOSS/tmp_bld_dir/logs/api-test.log
          SCRIPT
          docker run --rm --cap-add=CAP_AUDIT_WRITE --pids-limit=0 \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/var/FBOSS/fboss" -v "$RUNNER_TEMP/fboss-613:/var/FBOSS/tmp_bld_dir" \
            fboss_image bash /var/FBOSS/tmp_bld_dir/scripts/build-fake-tests.sh
      - name: Save validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-613-validation-logs
          path: |
            validation-logs/
            ${{ runner.temp }}/fboss-613/logs/
