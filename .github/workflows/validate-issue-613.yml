name: Validate issue 613
on:
  push:
    branches: [validation/fake-sai-cpu-queues]
permissions:
  contents: read
concurrency:
  group: issue-613-full-validation
  cancel-in-progress: false
jobs:
  fake-sai-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Make room on the disposable runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /
          free -h
      - name: Pin dependencies
        run: tar xzf fboss/oss/stable_commits/latest_stable_hashes.tar.gz --no-same-owner
      - name: Restore isolated build scratch
        id: scratch-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/fboss-613
          key: fboss-613-minsize-v1-${{ hashFiles('fboss/oss/docker/Dockerfile', 'fboss/oss/stable_commits/latest_stable_hashes.tar.gz') }}-${{ github.run_id }}
          restore-keys: |
            fboss-613-minsize-v1-${{ hashFiles('fboss/oss/docker/Dockerfile', 'fboss/oss/stable_commits/latest_stable_hashes.tar.gz') }}-
      - name: Build FBOSS container
        run: |
          set -o pipefail
          mkdir -p validation-logs
          docker build -t fboss_image -f fboss/oss/docker/Dockerfile . 2>&1 | tee validation-logs/image.log
      - name: Record baseline revision
        run: git ls-remote origin refs/heads/fix/fake-sai-cpu-queues | cut -f1 > "$RUNNER_TEMP/baseline-revision"
      - name: Build baseline fake-SAI tests
        run: |
          mkdir -p "$RUNNER_TEMP/fboss-613/scripts" "$RUNNER_TEMP/fboss-613/logs"
          cp .github/scripts/issue-613-build-heartbeat.sh "$RUNNER_TEMP/fboss-613/scripts/build-heartbeat.sh"
          cat > "$RUNNER_TEMP/fboss-613/scripts/build-fake-tests.sh" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          cd /var/FBOSS/fboss
          targets=("$@")
          if [[ ${#targets[@]} -eq 0 ]]; then
            targets=(--cmake-target switch_test --cmake-target api_test)
          fi
          log=/var/FBOSS/tmp_bld_dir/logs/build-$(date +%Y%m%d-%H%M%S).log
          ln -sfn "$(basename "$log")" /var/FBOSS/tmp_bld_dir/logs/latest.log
          ./fboss/oss/scripts/run-getdeps.py build --allow-system-packages \
            --build-type MinSizeRel \
            --extra-cmake-defines='{"CMAKE_CXX_STANDARD": "20", "RANGE_V3_TESTS": "OFF", "RANGE_V3_PERF": "OFF"}' \
            --scratch-path /var/FBOSS/tmp_bld_dir --src-dir /var/FBOSS/fboss \
            --num-jobs 2 "${targets[@]}" \
            fboss 2>&1 | tee "$log" | sed -u '/^-- Installing:/d; /^-- Up-to-date:/d'
          SCRIPT
          bash "$RUNNER_TEMP/fboss-613/scripts/build-heartbeat.sh" docker run --rm --cap-add=CAP_AUDIT_WRITE --pids-limit=0 \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/var/FBOSS/fboss" -v "$RUNNER_TEMP/fboss-613:/var/FBOSS/tmp_bld_dir" \
            fboss_image bash /var/FBOSS/tmp_bld_dir/scripts/build-fake-tests.sh \
            --cmake-target CMakeFiles/switch_test.dir/fboss/agent/hw/sai/switch/tests/HostifManagerTest.cpp.o
          bash "$RUNNER_TEMP/fboss-613/scripts/build-heartbeat.sh" docker run --rm --cap-add=CAP_AUDIT_WRITE --pids-limit=0 \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/var/FBOSS/fboss" -v "$RUNNER_TEMP/fboss-613:/var/FBOSS/tmp_bld_dir" \
            fboss_image bash /var/FBOSS/tmp_bld_dir/scripts/build-fake-tests.sh
      - name: Confirm baseline regression fails with issue 613
        run: |
          docker run --rm -i --cap-add=CAP_AUDIT_WRITE --pids-limit=0 \
            -v "$PWD:/var/FBOSS/fboss" -v "$RUNNER_TEMP/fboss-613:/var/FBOSS/tmp_bld_dir" \
            fboss_image bash -s <<'SCRIPT'
          set -euo pipefail
          test_binary=$(find /var/FBOSS/tmp_bld_dir/build -type f -name switch_test -executable -print -quit)
          test -n "$test_binary"
          set +e
          "$test_binary" --gtest_filter='HostifManagerTest.defaultCpu*' 2>&1 | tee /var/FBOSS/tmp_bld_dir/logs/baseline-regression.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'Voq ID : 9 exceeds max supported CPU queues: 8' /var/FBOSS/tmp_bld_dir/logs/baseline-regression.log
          SCRIPT
      - name: Wait for reviewed fix revision
        timeout-minutes: 60
        run: |
          baseline=$(cat "$RUNNER_TEMP/baseline-revision")
          while true; do
            revision=$(git ls-remote origin refs/heads/fix/fake-sai-cpu-queues | cut -f1)
            if [[ -n "$revision" && "$revision" != "$baseline" ]]; then
              git fetch origin refs/heads/fix/fake-sai-cpu-queues
              git checkout --detach FETCH_HEAD
              break
            fi
            sleep 30
          done
      - name: Build fixed fake-SAI tests incrementally
        run: |
          bash "$RUNNER_TEMP/fboss-613/scripts/build-heartbeat.sh" docker run --rm --cap-add=CAP_AUDIT_WRITE --pids-limit=0 \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/var/FBOSS/fboss" -v "$RUNNER_TEMP/fboss-613:/var/FBOSS/tmp_bld_dir" \
            fboss_image bash /var/FBOSS/tmp_bld_dir/scripts/build-fake-tests.sh
      - name: Run fixed regression and complete fake-SAI unit suites
        run: |
          docker run --rm -i --cap-add=CAP_AUDIT_WRITE --pids-limit=0 \
            -v "$PWD:/var/FBOSS/fboss" -v "$RUNNER_TEMP/fboss-613:/var/FBOSS/tmp_bld_dir" \
            fboss_image bash -s <<'SCRIPT'
          set -euo pipefail
          cd /var/FBOSS/fboss
          clang-format --style=file --dry-run --Werror fboss/agent/hw/switch_asics/FakeAsic.h fboss/agent/hw/sai/switch/tests/HostifManagerTest.cpp
          test_binary=$(find /var/FBOSS/tmp_bld_dir/build -type f -name switch_test -executable -print -quit)
          test -n "$test_binary"
          "$test_binary" --gtest_filter='HostifManagerTest.defaultCpu*' 2>&1 | tee /var/FBOSS/tmp_bld_dir/logs/fixed-regression.log
          "$test_binary" 2>&1 | tee /var/FBOSS/tmp_bld_dir/logs/switch-test.log
          api_binary=$(find /var/FBOSS/tmp_bld_dir/build -type f -name api_test -executable -print -quit)
          test -n "$api_binary"
          "$api_binary" 2>&1 | tee /var/FBOSS/tmp_bld_dir/logs/api-test.log
          SCRIPT
      - name: Make container build scratch readable by the cache action
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/fboss-613" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/fboss-613"
          fi
      - name: Preserve isolated build scratch
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/fboss-613
          key: ${{ steps.scratch-cache.outputs.cache-primary-key }}
      - name: Save validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-613-validation-logs
          path: |
            validation-logs/
            ${{ runner.temp }}/fboss-613/logs/
